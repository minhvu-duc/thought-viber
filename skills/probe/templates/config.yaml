# .thought-viber/config.yaml

beta_root: beta                       # beta code lives in <beta_root>/<feature>/
artifacts_root: .thought-viber/features

max_live_betas: 3                     # building + live + hardening at the same time
default_trial_days: 21
max_extensions: 1
reap_grace_days: 7                    # expired with no verdict -> recommend kill after this
max_hardening_days: 45                # keep -> durable; past this, status and reap flag it to the sponsor

# Where black-box acceptance tests live. <feature> is replaced per beta.
# Move it out of the dot-directory if your test runner ignores hidden paths (e.g. Go).
acceptance_dir: .thought-viber/features/<feature>/evidence/acceptance

flag_prefix: beta.                    # flag name = beta.<feature>
# Where flags live. Your choice:
#   runtime: a flag service or flags table; switching on/off takes effect instantly, no deploy
#   config:  a file or env var in the repo; each switch ships through a normal deploy
flag_system: ""                       # e.g. "runtime: launchdarkly", "runtime: flags table", "config: config/flags.yml"
data_prefix: beta_                    # beta data namespace = beta_<feature>_*

telemetry:
  event_prefix: beta.                 # events = beta.<feature>.<event>
  source: ""                          # where verdict reads usage: e.g. posthog, amplitude, sql:<query file>, logs

# How durable code marks what betas may import, so public_interfaces can name it by path.
# Public and internal code must not share files, or no glob can tell them apart.
public_interface_convention: ""       # e.g. "src/<module>/public/**", "packages/<module>/index.ts"

# Durable modules beta code may import, including facades and extension points added
# for betas (see vibe → Durable prep). Everything else in durable code is off limits.
# Each entry follows public_interface_convention.
public_interfaces: []                 # e.g. ["src/api/public/**", "packages/sdk/**", "src/checkout/extensions/**"]

# Safety floor: areas where a mistake hurts users. A beta that touches one warns the user and
# records the touch in probe.md (code touches need the sponsor's acceptance). The list below is the default;
# add, remove or reword items to fit your project.
safety_floor:
  - auth
  - payments
  - permissions
  - pii handling
  - secrets
  - existing core schema          # new namespaced beta_<feature>_* columns are allowed
# Code paths that implement the safety floor. A beta change here must be an accepted floor touch
# in probe.md, or gate fails it; reap undoes it.
# A direct feature that builds floor code adds its paths here in the same change.
floor_paths: []                       # e.g. ["src/auth/**", "src/billing/**", "src/permissions/**"]
